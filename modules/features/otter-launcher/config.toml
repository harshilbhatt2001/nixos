[general]
height = 7 # lines the launcher occupies; 0 for fullscreen
default_module = "app" # module to run when no prefix is matched
empty_module = "app" # run with an empty prompt
exec_cmd = "@fish@ -c" # exec command of your shell
vi_mode = false # set true to use vi keybinds, false emacs keybinds
cheatsheet_entry = "?" # when prompted, will show a list of configured modules
cheatsheet_viewer = "less -R; clear" # command to show cheatsheet; through piping stdout
external_editor = "nvim" # ctrl+x ctrl+e (or v in vi normal mode) edits the prompt in this program

[interface]
padding = [0, 1, 0, 1] # [top, right, down, left]
# ANSI codes and shell expansion (through exec_cmd) are allowed
header = "\x1b[1;38;2;203;166;247m$USER@nixos\x1b[0m"
# colours: https://docs.rs/ratatui/latest/ratatui/prelude/enum.Color.html
prompt_sign = "> "
prompt_sign_color = "magenta"
placeholder = "execute"
suggestion_mode = "list" # available options: list, hint
suggestion_position = "bottom" # relative to the input field
separator = true # line between input field and suggestion list (list mode only)
separator_label = ""
scrollbar = false
list_prefix = "  "
selection_prefix = "▌ "
selection_prefix_color = "red"
inverse_selection = false
prefix_padding = 3 # format prefixes to have a uniformed width
prefix_color = "yellow"
description_color = "reset"
indicator_args = " * " # shown for modules taking an argument
indicator_bare = " "
indicator_color = "red"

[[modules]]
description = "programs"
prefix = "app"
cmd = """
hyprctl dispatch 'hl.dsp.window.resize({x = 700, y = 700, window = activewindow})' &&
hyprctl dispatch 'hl.dsp.window.center({window = activewindow})'&&
@fsel@ --refresh-cache >/dev/null &&
hyprctl dispatch "hl.dsp.exec_cmd('$(@fsel@ --no-exec)')"
"""

[[modules]]
description = "bluetooth"
prefix = "bl"
cmd = """
hyprctl dispatch 'hl.dsp.window.resize({x = 650, y = 400, window = activewindow})' &&
hyprctl dispatch 'hl.dsp.window.center({window = activewindow})'&&
@bluetui@
"""

[[modules]]
description = "audio"
prefix = "au"
cmd = """
hyprctl dispatch 'hl.dsp.window.resize({x = 900, y = 500, window = activewindow})' &&
hyprctl dispatch 'hl.dsp.window.center({window = activewindow})'&&
@wiremix@
"""

[[modules]]
description = "wallpaper"
prefix = "wp"
cmd = """
hyprctl dispatch 'hl.dsp.window.resize({x = 900, y = 500, window = activewindow})' &&
hyprctl dispatch 'hl.dsp.window.center({window = activewindow})'&&
@wallpaper-picker@
"""

[[modules]]
description = "nixos wiki"
prefix = "nw"
cmd = """
hyprctl dispatch "hl.dsp.exec_cmd('@browser@ --new-window https://wiki.nixos.org/w/index.php?search={}')"
"""
with_argument = true
url_encode = true
unbind_proc = true

[[modules]]
description = "nixpkgs"
prefix = "nix"
cmd = """
hyprctl dispatch "hl.dsp.exec_cmd('@browser@ --new-window https://search.nixos.org/packages?query={}')"
"""
with_argument = true
url_encode = true
unbind_proc = true

[[modules]]
description = "youtube"
prefix = "y"
cmd = """
hyprctl dispatch "hl.dsp.exec_cmd('@browser@ https://www.youtube.com')"
"""
with_argument = false
url_encode = true
unbind_proc = true

[[modules]]
description = "whatsapp"
prefix = "w"
cmd = """
hyprctl dispatch "hl.dsp.exec_cmd('@browser@ https://web.whatsapp.com')"
"""
with_argument = false
url_encode = true
unbind_proc = true
